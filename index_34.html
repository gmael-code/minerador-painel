<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minerador de Criativos — v2 (Supabase)</title>
<style>
  :root{--bg:#0b0e14;--panel:#111725;--line:#1e2636;--txt:#e6edf7;--mut:#8592a6;
    --green:#22c55e;--amber:#eab308;--gray:#94a3b8;--red:#ef4444;--chip:#1a2334;--accent:#e11d48;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:18px 24px 80px;max-width:1600px;margin:0 auto}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .search{flex:1;min-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px}
  .search input{background:none;border:none;color:var(--txt);font-size:14px;outline:none;width:100%}
  .search input::placeholder{color:var(--mut)}
  select{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font-size:14px}
  .stamp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}
  .stamp b{color:var(--txt)} .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.15)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;color:var(--mut);cursor:pointer}
  .tab.on{background:#fff;color:#0b0e14;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .thumb{position:relative;aspect-ratio:1/1.05;background:#0d1420;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb video{width:100%;height:100%;object-fit:cover;background:#000}
  .semarte{color:#4b5a72;font-size:12px}
  .mono{position:absolute;font-size:52px;font-weight:800;color:#22304a}
  .badge{position:absolute;top:9px;font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;color:#fff}
  .score{left:9px;background:rgba(0,0,0,.6)} .score.hi{color:#4ade80}.score.md{color:#fde047}.score.lo{color:#cbd5e1}
  .xn{right:9px;background:var(--accent);border-radius:999px}
  .play{position:absolute;width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .play::after{content:"";border-left:17px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
  .vfac.on .play,.vfac.on img,.vfac.on .semarte,.vfac.on .mono{display:none}
  .body{padding:13px 14px 11px;display:flex;flex-direction:column;gap:8px;flex:1}
  .title{font-size:14.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .c{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
  .c.esc{background:rgba(34,197,94,.15);color:#4ade80}.c.med{background:rgba(234,179,8,.16);color:#facc15}
  .c.bai{background:rgba(148,163,184,.15);color:#cbd5e1}.c.tag{background:var(--chip);color:#aab6c8}
  .c.okk{background:transparent;color:#7c8aa0;border:1px solid var(--line)}
  .c.fl{background:rgba(234,179,8,.16);color:#facc15}.c.ff{background:rgba(239,68,68,.16);color:#fca5a5}
  .meta{font-size:12px;color:var(--mut)}
  .foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:9px}
  .av{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;background:#33415a}
  .adv{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .ab{color:#8aa0c0;font-size:13px;text-decoration:none}
  #status{text-align:center;color:var(--mut);padding:30px;font-size:14px}
  #sentinel{height:1px}
</style>
</head>
<body>
  <div class="topbar">
    <div class="search"><span>🔎</span><input id="q" placeholder="Buscar — casa, texto, promessa..."></div>
    <select id="ord">
      <option value="escala_score.desc.nullslast">Relevância</option>
      <option value="dias_no_ar.asc.nullslast">Mais novos</option>
      <option value="dias_no_ar.desc.nullslast">Mais tempo no ar</option>
    </select>
    <div class="stamp"><span class="dot"></span> <b id="total">…</b>&nbsp;criativos no banco</div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab on" data-f="todos">Tudo</div>
    <div class="tab" data-f="escalados">Escalados</div>
    <div class="tab" data-f="video">Vídeo</div>
    <div class="tab" data-f="imagem">Imagem</div>
    <div class="tab" data-f="enc">Encerrados</div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="status">carregando…</div>
  <div id="sentinel"></div>

<script>
const URL_="https://rylizwxolqyfsnnugajw.supabase.co", ANON="sb_publishable_u_c0-_w4juF04wRvRZrkQA_WWSScq4J", IMG="https://minerador-criativos.pages.dev/";
const PAGE=30;
let offset=0, filtro="todos", termo="", ordem="escala_score.desc.nullslast", carregando=false, acabou=false, total=null;
const grid=document.getElementById('grid'), status=document.getElementById('status');

function queryURL(){
  let u=URL_.replace(/\/$/,'')+"/rest/v1/criativos?select=*";
  u+="&order="+ordem;
  if(filtro==="escalados") u+="&escala_tier=eq.ESCALADO";
  else if(filtro==="video") u+="&midia=eq.video";
  else if(filtro==="imagem") u+="&midia=neq.video";
  else if(filtro==="enc") u+="&no_ar=is.false";
  if(filtro!=="enc") u+="&no_ar=not.is.false";
  if(termo){ const t=encodeURIComponent("*"+termo+"*"); u+=`&or=(advertiser.ilike.${t},texto.ilike.${t})`; }
  u+=`&limit=${PAGE}&offset=${offset}`;
  return u;
}
async function carregar(){
  if(carregando||acabou) return;
  carregando=true; status.textContent="carregando…";
  try{
    const r=await fetch(queryURL(),{headers:{apikey:ANON,Authorization:"Bearer "+ANON,Prefer:"count=planned"}});
    if(!r.ok){ status.textContent="erro ao ler ("+r.status+"): "+(await r.text()).slice(0,120); carregando=false; return; }
    const cr=r.headers.get("content-range"); if(cr&&total===null){ total=cr.split("/")[1]; document.getElementById('total').textContent=Number(total).toLocaleString('pt-BR'); }
    const linhas=await r.json();
    linhas.forEach(row=>grid.appendChild(montar(row)));
    offset+=linhas.length;
    if(linhas.length<PAGE) acabou=true;
    status.textContent=acabou?(offset?`fim — ${offset} carregados`:"nada encontrado"):"";
  }catch(e){ status.textContent="erro: "+e.message; }
  carregando=false;
}
function tierCls(t){t=(t||"").toUpperCase();if(t==="ESCALADO")return["esc","Escalado"];if(t==="ALTA")return["esc","Alta"];if(t==="MEDIA"||t==="MÉDIA")return["med","Média"];return["bai","Baixa"];}
function compCls(s){s=(s||"");if(s.indexOf("FORTE")>=0)return["ff",s];if(s.indexOf("FLAG")>=0)return["fl","FLAG LEVE"];return["okk","LEGENDA OK"];}
function montar(row){
  const d=row.dados||row;
  const el=document.createElement('article'); el.className='card';
  const [tc,tn]=tierCls(row.escala_tier||d.escala_tier);
  const [cc,cn]=compCls(row.compliance_status||d.compliance_status);
  const score=row.escala_score??d.escala_score??0;
  const sc=score>=90?'hi':score>=70?'md':'lo';
  const versoes=d.versoes||1;
  const inicial=((row.advertiser||d.advertiser||'?')[0]||'?').toUpperCase();
  const arte=d._arte?IMG+d._arte:"";
  const video=d._video?IMG+d._video:"";
  const titulo=(d.texto||d.conceito||row.advertiser||'').toString();
  let visual;
  if(arte) visual=`<img loading="lazy" src="${arte}" alt="">`;
  else visual=`<span class="mono">${inicial}</span><span class="semarte">arte não capturada</span>`;
  const badges=`<span class="badge score ${sc}">${score}</span>`+(versoes>1?`<span class="badge xn">×${versoes}</span>`:'');
  if(video){
    el.innerHTML=`<div class="thumb vfac" data-v="${video}" data-lib="${row.library_id}">${visual}${badges}<span class="play"></span></div>`+corpo(row,d,tc,tn,cc,cn,titulo,inicial,score,versoes);
    const fac=el.querySelector('.vfac');
    fac.addEventListener('click',()=>{
      if(fac.querySelector('video'))return;
      const v=document.createElement('video');v.controls=true;v.autoplay=true;v.playsInline=true;v.src=fac.dataset.v;
      v.addEventListener('error',()=>{v.remove();fac.classList.remove('on');window.open('https://www.facebook.com/ads/library/?id='+fac.dataset.lib,'_blank');},{once:true});
      fac.prepend(v);fac.classList.add('on');
    });
  } else {
    const href='https://www.facebook.com/ads/library/?id='+row.library_id;
    el.innerHTML=`<a class="thumb" href="${href}" target="_blank" rel="noopener">${visual}${badges}</a>`+corpo(row,d,tc,tn,cc,cn,titulo,inicial,score,versoes);
  }
  return el;
}
function corpo(row,d,tc,tn,cc,cn,titulo,inicial,score,versoes){
  const cat=d.categoria?`<span class="c tag">${d.categoria}</span>`:'';
  const dias=(row.dias_no_ar??d.dias_no_ar??0);
  const usam=d.versoes||1;
  const nota=(row.compliance_nota??d.compliance_nota??'—');
  return `<div class="body">
    <div class="title">${esc(titulo)}</div>
    <div class="chips"><span class="c ${tc}">${tn}</span>${cat}<span class="c ${cc}">${cn}</span></div>
    <div class="meta">▸ compliance ${nota}/100 · ${dias}d no ar · ${usam} anúncio(s)</div>
  </div>
  <div class="foot"><div class="av">${inicial}</div><div class="adv">${esc(row.advertiser||d.advertiser||'')}</div>
    <a class="ab" href="https://www.facebook.com/ads/library/?id=${row.library_id}" target="_blank" rel="noopener">abrir ↗</a></div>`;
}
function esc(s){return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function resetar(){offset=0;acabou=false;grid.innerHTML='';carregar();}
document.getElementById('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');filtro=t.dataset.f;resetar();});
let deb; document.getElementById('q').addEventListener('input',e=>{clearTimeout(deb);deb=setTimeout(()=>{termo=e.target.value.trim();resetar();},350);});
document.getElementById('ord').addEventListener('change',e=>{ordem=e.target.value;resetar();});
new IntersectionObserver(es=>{if(es[0].isIntersecting)carregar();},{rootMargin:"600px"}).observe(document.getElementById('sentinel'));
carregar();
</script>
</body>
</html>
